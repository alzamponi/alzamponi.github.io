<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo HTML + CSS + JS</title>

  
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  
    <h1>📋 Cadastro de Pessoa</h1>

    <form id="formCadastro">
      <label for="nome">Nome</label>
      <input type="text" id="nome" placeholder="Digite seu nome" required>

      <label for="idade">Idade</label>
      <input type="number" id="idade" placeholder="Digite sua idade" min="0" max="120" required>

      <button type="submit">Exibir dados</button>
    </form>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var form = document.getElementById('formCadastro');
    var campoNome = document.getElementById('nome');
    var campoIdade = document.getElementById('idade');
    var saida = document.getElementById('saida');

    form.addEventListener('submit', function (evento) {
      evento.preventDefault();

      var nome = campoNome.value.trim();
      var idade = campoIdade.value;

      saida.textContent = 'Olá, ' + nome + '! Você tem ' + idade + ' anos.';
      saida.style.display = 'block';

      form.reset();
    });
  });
</script>
</body>
</html>
