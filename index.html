<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enduro — Corrida Clássica</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #fff;
        }
        .game-wrap { text-align: center; }
        canvas {
            background: #1a1a1a;
            border: 3px solid #333;
            display: block;
            margin: 0 auto;
            image-rendering: pixelated;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 18px;
            letter-spacing: 2px;
            background: #111;
            border: 3px solid #333;
            border-top: none;
        }
        .hud span { padding: 0 15px; }
        .hud .accent { color: #ffd700; }
        .controls {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
            line-height: 1.6;
        }
        .controls b { color: #ffd700; }
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.85);
            gap: 20px;
        }
        .overlay h1 {
            font-size: 48px;
            color: #ffd700;
            text-shadow: 0 0 20px #ffd700;
            letter-spacing: 8px;
        }
        .overlay p { font-size: 16px; color: #ccc; max-width: 400px; line-height: 1.7; }
        .overlay button {
            background: #ffd700;
            color: #111;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            transition: transform 0.2s;
        }
        .overlay button:hover { transform: scale(1.1); }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="game-wrap">
    <div class="hud">
        <span>DIA <b class="accent" id="day">1</b></span>
        <span>CARROS <b class="accent" id="score">0</b></span>
        <span>VEL <b class="accent" id="speed">60</b></span>
    </div>
    <canvas id="game" width="480" height="600"></canvas>
    <div class="controls">
        <b>← →</b> ou <b>A D</b> para dirigir &nbsp;|&nbsp; <b>↑ ↓</b> / <b>W S</b> para acelerar/frear
    </div>
</div>

<!-- Tela inicial -->
<div class="overlay" id="startScreen">
    <h1>ENDURO</h1>
    <p>Ultrapasse o máximo de carros possível em um dia de corrida. Cada dia termina ao anoitecer — a cada dia o tráfego aumenta e a pista fica mais perigosa. Cuidado com as colisões!</p>
    <button onclick="startGame()">▶ INICIAR</button>
</div>

<!-- Tela de game over -->
<div class="overlay hidden" id="gameOver">
    <h1>FIM DE JOGO</h1>
    <p id="finalScore"></p>
    <button onclick="startGame()">↻ JOGAR DE NOVO</button>
</div>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = 480, H = 600;

    // ====== Estado do jogo ======
    let game = null;

    // ====== Classe principal ======
    class Enduro {
        constructor() {
            this.day = 1;
            this.score = 0;
            this.speed = 60;
            this.maxSpeed = 200;
            this.running = true;

            // Carro do jogador
            this.player = { x: W/2 - 15, y: H - 100, w: 30, h: 55 };

            // Estrada (rolagem)
            this.roadOffset = 0;
            this.roadWidth = 220;
            this.roadX = (W - this.roadWidth) / 2;

            // Tráfego
            this.cars = [];
            this.spawnTimer = 0;

            // Teclas
            this.keys = {};

            // Colisão
            this.collisionCooldown = 0;
            this.maxCollisions = 3;
            this.collisions = 0;
        }

        update(dt) {
            if (!this.running) return;

            // ====== Controle do jogador ======
            const moveSpeed = 300 * dt;
            if (this.keys['ArrowLeft'] || this.keys['a']) this.player.x -= moveSpeed;
            if (this.keys['ArrowRight'] || this.keys['d']) this.player.x += moveSpeed;
            if (this.keys['ArrowUp'] || this.keys['w']) this.speed = Math.min(this.maxSpeed, this.speed + 120 * dt);
            if (this.keys['ArrowDown'] || this.keys['s']) this.speed = Math.max(30, this.speed - 150 * dt);

            // Limitar jogador à estrada
            this.player.x = Math.max(this.roadX + 5, Math.min(this.roadX + this.roadWidth - this.player.w - 5, this.player.x));

            // ====== Rolagem da estrada ======
            this.roadOffset = (this.roadOffset + this.speed * dt) % 40;

            // ====== Gerar tráfego ======
            this.spawnTimer -= dt;
            const spawnInterval = Math.max(0.4, 1.6 - this.day * 0.15);
            if (this.spawnTimer <= 0) {
                this.spawnCar();
                this.spawnTimer = spawnInterval;
            }

            // ====== Mover tráfego (mais lento que o jogador = ultrapassagem) ======
            const carSpeed = this.speed * 0.45;
            for (let i = this.cars.length - 1; i >= 0; i--) {
                const c = this.cars[i];
                c.y += carSpeed * dt;
                // Carro ultrapassado
                if (!c.counted && c.y > this.player.y + this.player.h) {
                    c.counted = true;
                    this.score++;
                }
                // Remover fora da tela
                if (c.y > H + 60) this.cars.splice(i, 1);
            }

            // ====== Colisões ======
            this.collisionCooldown -= dt;
            for (const c of this.cars) {
                if (this.collide(this.player, c) && this.collisionCooldown <= 0) {
                    this.collisions++;
                    this.collisionCooldown = 1.2;
                    this.speed = Math.max(30, this.speed * 0.5);
                    if (this.collisions >= this.maxCollisions) {
                        this.running = false;
                        this.showGameOver();
                    }
                }
            }

            // ====== Avanço de dia (tempo de corrida) ======
            // Simula o "anoitecer" — a cada ~30s avança o dia
            if (this.dayTimer === undefined) this.dayTimer = 30;
            this.dayTimer -= dt;
            if (this.dayTimer <= 0) {
                this.day++;
                this.dayTimer = 30;
                this.maxSpeed += 15;
            }
        }

        spawnCar() {
            const w = 30, h = 55;
            const laneCount = 3;
            const laneWidth = this.roadWidth / laneCount;
            const lane = Math.floor(Math.random() * laneCount);
            const x = this.roadX + lane * laneWidth + (laneWidth - w) / 2;
            // Não spawnar em cima do jogador
            if (Math.abs(x - this.player.x) < 50) return;
            const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6', '#e67e22'];
            this.cars.push({
                x, y: -60,
                w, h,
                color: colors[Math.floor(Math.random() * colors.length)],
                counted: false
            });
        }

        collide(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x &&
                   a.y < b.y + b.h && a.y + a.h > b.y;
        }

        // ====== Desenho ======
        draw() {
            // Fundo (grama)
            ctx.fillStyle = '#1a5c1a';
            ctx.fillRect(0, 0, W, H);

            // Estrada
            ctx.fillStyle = '#333';
            ctx.fillRect(this.roadX, 0, this.roadWidth, H);

            // Faixas centrais (rolagem)
            ctx.fillStyle = '#ffd700';
            const dashH = 20, gap = 20;
            const centerX = W / 2;
            for (let y = -dashH + this.roadOffset; y < H; y += dashH + gap) {
                ctx.fillRect(centerX - 2, y, 4, dashH);
            }

            // Bordas da estrada
            ctx.fillStyle = '#fff';
            ctx.fillRect(this.roadX, 0, 4, H);
            ctx.fillRect(this.roadX + this.roadWidth - 4, 0, 4, H);

            // Tráfego
            for (const c of this.cars) {
                this.drawCar(c.x, c.y, c.w, c.h, c.color);
            }

            // Jogador
            this.drawCar(this.player.x, this.player.y, this.player.w, this.player.h, '#ffd700');

            // Efeito de colisão (flash)
            if (this.collisionCooldown > 0.9) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fillRect(0, 0, W, H);
            }
        }

        drawCar(x, y, w, h, color) {
            // Carro (retângulo com janela)
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
            ctx.fillStyle = '#111';
            ctx.fillRect(x + w * 0.2, y + h * 0.3, w * 0.6, h * 0.25); // janela
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(x + 2, y + 2, w - 4, 4); // brilho do capô
        }

        showGameOver() {
            document.getElementById('finalScore').textContent =
                `Você ultrapassou ${this.score} carros em ${this.day} dia(s)`;
            document.getElementById('gameOver').classList.remove('hidden');
        }
    }

    // ====== Loop principal ======
    let lastTime = 0;
    function loop(time) {
        const dt = Math.min(0.05, (time - lastTime) / 1000);
        lastTime = time;
        if (game && game.running) {
            game.update(dt);
            game.draw();
            updateHUD();
        }
        requestAnimationFrame(loop);
    }

    function updateHUD() {
        document.getElementById('day').textContent = game.day;
        document.getElementById('score').textContent = game.score;
        document.getElementById('speed').textContent = Math.round(game.speed);
    }

    // ====== Controles ======
    document.addEventListener('keydown', e => {
        if (game) game.keys[e.key] = true;
    });
    document.addEventListener('keyup', e => {
        if (game) game.keys[e.key] = false;
    });

    // ====== Iniciar ======
    function startGame() {
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('gameOver').classList.add('hidden');
        game = new Enduro();
    }

    // ====== Inicializar ======
    requestAnimationFrame(loop);
</script>
</body>
</html>
